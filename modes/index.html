      <h1>教会调式</h1>
      <p class="lede">七个调式一次看一个。大调色彩的，拿来和自然大调比。小调色彩的，拿来和自然小调比。差在哪一级，就说哪一级。</p>
      <p class="lede quiet">打开先停在多利亚。伊奥尼亚就是大调，爱奥利亚就是自然小调，你已经会。旋律是单音，连放两遍。进行先听柱式，再听琶音，大约每分钟 90 拍。点一下才会出声。</p>
